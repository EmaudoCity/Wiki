{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Wiki{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'encyclopedia/styles.css' %}">
</head>
<body>
    <div class="sidebar">
        <a class="brand" href="{% url 'encyclopedia:index' %}">Wiki</a>

        <form class="search" action="{% url 'encyclopedia:search' %}" method="get">
            <input type="text" name="q" placeholder="Search Encyclopedia" aria-label="Search Encyclopedia">
            <button type="submit">Search</button>
        </form>

        <nav>
            <a href="{% url 'encyclopedia:index' %}">Home</a>
            <a href="{% url 'encyclopedia:new' %}">Create New Page</a>
            <a href="{% url 'encyclopedia:random' %}">Random Page</a>
        </nav>
    </div>

    <main class="main">
        {% block body %}{% endblock %}
    </main>
</body>
</html>
