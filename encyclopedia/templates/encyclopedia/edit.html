{% extends "encyclopedia/layout.html" %}

{% block title %}Edit {{ title }}{% endblock %}

{% block body %}
    <h1>Edit {{ title }}</h1>
    <form action="{% url 'encyclopedia:edit' title %}" method="post">
        {% csrf_token %}
        <textarea name="content" rows="20" cols="80">{{ content }}</textarea>
        <div><input type="submit" value="Save"></div>
    </form>
{% endblock %}
